 *  RELATÓRIOS
 * ================================================================= */
function Barra({ rotulo: r, valor, total, cor = C.brass, extra, pct: pctProp }) {
  /* pctProp é usado quando o próprio valor já é uma porcentagem. */
  const bruto = pctProp != null ? pctProp : (total ? (Number(valor) / total) * 100 : 0);
  const pct = Math.max(0, Math.min(100, Math.round(Number.isFinite(bruto) ? bruto : 0)));
  return (
    <div style={{ marginBottom:11 }}>
      <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:5 }}>
        <span style={{ fontSize:13, fontWeight:500, marginRight:"auto" }}>{r}</span>
        {extra && <span style={{ fontSize:11.5, color:C.muted }}>{extra}</span>}
        <span style={{ fontSize:13, fontWeight:700, color:cor }}>{valor}</span>
        {pctProp == null && (
          <span style={{ fontSize:11.5, color:C.muted, minWidth:34, textAlign:"right" }}>{pct}%</span>
        )}
      </div>
      <div style={{ height:7, borderRadius:99, background:C.lineSoft, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${pct}%`, background:cor, borderRadius:99,
                      transition:"width .4s ease" }} />
      </div>
    </div>
  );
}

function Relatorios({ ctx }) {
  const { clientes, perfil, P } = ctx;
  const [periodo, setPeriodo] = useState("90");
  const [de, setDe] = useState(addDays(todayISO(), -90));
  const [ate, setAte] = useState(todayISO());

  const [ini, fim] = useMemo(() => {
    const hoje = todayISO();
    if (periodo === "custom") return [de, ate];
    if (periodo === "mes") return [hoje.slice(0,8) + "01", hoje];
    if (periodo === "ano") return [hoje.slice(0,4) + "-01-01", hoje];
    if (periodo === "todos") return ["1900-01-01", hoje];
    return [addDays(hoje, -Number(periodo)), hoje];
  }, [periodo, de, ate]);

  const base = useMemo(() => {
    let l = clientes.itens.filter(c => {
      const d = (c.criadoEm || "").slice(0,10);
      return d >= ini && d <= fim;
    });
    if (P.relatorios === "proprios") l = l.filter(c => c.responsavel === perfil.uid);
    return l;
  }, [clientes.itens, ini, fim, P.relatorios, perfil.uid]);

  const ganhos    = base.filter(c => c.desfecho === "ganho");
  const perdidos  = base.filter(c => c.desfecho === "perdido");
  const emAberto  = base.filter(c => !c.desfecho);
  const decididos = ganhos.length + perdidos.length;
  const taxa = decididos ? Math.round((ganhos.length / decididos) * 100) : 0;
  const receita = ganhos.reduce((s, c) => s + (Number(c.valorProposta) || 0), 0);

  /* origem: volume e conversão */
  const porOrigem = useMemo(() => {
    const m = {};
    base.forEach(c => {
      const k = rotulo(c.origem, c.origemOutro);
      if (!m[k]) m[k] = { total:0, ganho:0, perdido:0, aberto:0, valor:0 };
      m[k].total++;
      if (c.desfecho === "ganho") { m[k].ganho++; m[k].valor += Number(c.valorProposta) || 0; }
      else if (c.desfecho === "perdido") m[k].perdido++;
      else m[k].aberto++;
    });
    return Object.entries(m).map(([k, v]) => ({
      origem: k, ...v,
      taxa: (v.ganho + v.perdido) ? Math.round((v.ganho / (v.ganho + v.perdido)) * 100) : null
    })).sort((a,b) => b.total - a.total);
  }, [base]);

  /* motivos, com "Outro" agrupado e detalhado */
  const contarMotivos = (arr) => {
    const m = {}, outros = {};
    arr.forEach(c => {
      const k = c.motivo || "Sem motivo registrado";
      m[k] = (m[k] || 0) + 1;
      if (c.motivo === "Outro" && c.motivoOutro) {
        outros[c.motivoOutro] = (outros[c.motivoOutro] || 0) + 1;
      }
    });
    return {
      lista: Object.entries(m).map(([k, v]) => ({ motivo:k, n:v })).sort((a,b) => b.n - a.n),
      outros: Object.entries(outros).map(([k, v]) => ({ texto:k, n:v })).sort((a,b) => b.n - a.n)
    };
  };
  const mp = useMemo(() => contarMotivos(perdidos), [base]);
  const mg = useMemo(() => contarMotivos(ganhos), [base]);

  /* origens digitadas à mão */
  const origensLivres = useMemo(() => {
    const m = {};
    base.filter(c => c.origem === "Outro" && c.origemOutro)
        .forEach(c => { m[c.origemOutro] = (m[c.origemOutro] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => ({ texto:k, n:v })).sort((a,b) => b.n - a.n);
  }, [base]);

  /* como os contatos foram feitos, somando todos os ciclos */
  const porCanal = useMemo(() => {
    const todos = [];
    base.forEach(c => {
      (Array.isArray(c.followups) ? c.followups : []).forEach(f => todos.push(f));
      (c.historicoCiclos || []).forEach(h => (h.followups || []).forEach(f => todos.push(f)));
    });
    const feitos = todos.filter(f => f.feito);
    const m = {};
    feitos.forEach(f => {
      const k = f.canal === "Outro" ? (f.canalOutro || "Outro") : (f.canal || "Não informado");
      if (!m[k]) m[k] = { total:0, resposta:0 };
      m[k].total++;
      if (!f.semResposta) m[k].resposta++;
    });
    return {
      total: feitos.length,
      semNota: feitos.filter(f => !f.semResposta && !String(f.nota || "").trim()).length,
      lista: Object.entries(m).map(([k, v]) => ({
        canal:k, ...v, taxa: v.total ? Math.round((v.resposta / v.total) * 100) : 0
      })).sort((a,b) => b.total - a.total)
    };
  }, [base]);

  /* tempo médio até o ganho */
  const tempoMedio = useMemo(() => {
    const dias = ganhos
      .filter(c => c.criadoEm && c.desfechoEm)
      .map(c => diffDays(c.desfechoEm.slice(0,10), c.criadoEm.slice(0,10)))
      .filter(d => d >= 0);
    if (!dias.length) return null;
    return Math.round(dias.reduce((a,b) => a+b, 0) / dias.length);
  }, [base]);

  const reabertos = base.filter(c => (c.ciclo || 1) > 1).length;

  return (
    <div className="rise">
      <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:8 }}>
        <h1 className="fr" style={{ fontSize:26, fontWeight:700, marginRight:"auto" }}>Relatórios</h1>
        <Sel value={periodo} onChange={e => setPeriodo(e.target.value)} style={{ maxWidth:190 }}>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="mes">Mês atual</option>
          <option value="ano">Ano atual</option>
          <option value="todos">Desde o início</option>
          <option value="custom">Período específico</option>
        </Sel>
      </div>

      {periodo === "custom" && (
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:8 }}>
          <Inp type="date" value={de} onChange={e => setDe(e.target.value)} style={{ maxWidth:170 }} />
          <Inp type="date" value={ate} onChange={e => setAte(e.target.value)} style={{ maxWidth:170 }} />
        </div>
      )}
      <p style={{ fontSize:12.5, color:C.muted, marginBottom:20 }}>
        {base.length} {base.length === 1 ? "lead cadastrado" : "leads cadastrados"} entre {fmtBR(ini)} e {fmtBR(fim)}
        {P.relatorios === "proprios" ? " · apenas os seus" : ""}
      </p>

      {base.length === 0 ? (
        <Vazio titulo="Sem dados neste período"
               texto="Nenhum lead foi cadastrado no intervalo selecionado. Experimente ampliar o período." />
      ) : (
      <>
        {/* números do topo */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",
                      gap:12, marginBottom:22 }}>
          {[
            { r:"Leads no período", v:base.length, c:C.ink },
            { r:"Ganhos", v:ganhos.length, c:C.ok },
            { r:"Perdidos", v:perdidos.length, c:C.late },
            { r:"Ainda em aberto", v:emAberto.length, c:C.muted },
            { r:"Taxa de conversão", v:`${taxa}%`, c:C.brass },
            { r:"Valor fechado", v:brl(receita), c:C.ok }
          ].map(n => (
            <Card key={n.r} style={{ padding:"15px 17px" }}>
              <div className="fr" style={{ fontSize:24, fontWeight:700, color:n.c, lineHeight:1.15 }}>{n.v}</div>
              <div style={{ fontSize:11.5, color:C.muted, marginTop:4 }}>{n.r}</div>
            </Card>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(330px,1fr))", gap:16 }}>
          {/* volume por origem */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>De onde vêm os leads</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              Quantidade de novos contatos por canal no período.
            </p>
            {porOrigem.map(o => (
              <Barra key={o.origem} rotulo={o.origem} valor={o.total} total={base.length} cor={C.ink} />
            ))}
          </Card>

          {/* conversão por origem */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>Quais origens fecham contrato</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              Percentual de ganhos entre os leads já decididos. Volume alto com conversão baixa
              é canal caro; o contrário indica onde vale investir.
            </p>
            {porOrigem.filter(o => o.taxa !== null).length === 0 ? (
              <p style={{ fontSize:13, color:C.muted }}>
                Nenhum lead deste período teve desfecho ainda. Marque ganho ou perdido no funil
                para que a conversão apareça aqui.
              </p>
            ) : porOrigem.filter(o => o.taxa !== null).sort((a,b) => b.taxa - a.taxa).map(o => (
              <Barra key={o.origem} rotulo={o.origem} valor={`${o.taxa}%`} pct={o.taxa}
                     cor={o.taxa >= 50 ? C.ok : o.taxa >= 25 ? C.brass : C.late}
                     extra={`${o.ganho} fechado${o.ganho === 1 ? "" : "s"} de ${o.ganho + o.perdido}`} />
            ))}
          </Card>

          {/* motivos de perda */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>Por que perdemos</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              {perdidos.length} {perdidos.length === 1 ? "lead perdido" : "leads perdidos"} no período.
            </p>
            {perdidos.length === 0
              ? <p style={{ fontSize:13, color:C.muted }}>Nenhuma perda registrada.</p>
              : mp.lista.map(m => (
                  <Barra key={m.motivo} rotulo={m.motivo} valor={m.n} total={perdidos.length} cor={C.late} />
                ))}
            {mp.outros.length > 0 && (
              <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${C.lineSoft}` }}>
                <div style={{ fontSize:12, fontWeight:600, color:C.inkSoft, marginBottom:8 }}>
                  O que foi digitado em "Outro"
                </div>
                {mp.outros.map(o => (
                  <div key={o.texto} style={{ display:"flex", gap:8, fontSize:12.5,
                                              color:C.inkSoft, padding:"4px 0" }}>
                    <span style={{ marginRight:"auto" }}>{o.texto}</span>
                    <strong>{o.n}</strong>
                  </div>
                ))}
                <p style={{ fontSize:11, color:C.muted, marginTop:8, lineHeight:1.5 }}>
                  Se um mesmo texto se repete bastante, vale virar opção fixa da lista.
                </p>
              </div>
            )}
          </Card>

          {/* motivos de ganho */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>Por que ganhamos</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              {ganhos.length} {ganhos.length === 1 ? "contrato fechado" : "contratos fechados"} no período.
            </p>
            {ganhos.length === 0
              ? <p style={{ fontSize:13, color:C.muted }}>Nenhum ganho registrado.</p>
              : mg.lista.map(m => (
                  <Barra key={m.motivo} rotulo={m.motivo} valor={m.n} total={ganhos.length} cor={C.ok} />
                ))}
            {mg.outros.length > 0 && (
              <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${C.lineSoft}` }}>
                <div style={{ fontSize:12, fontWeight:600, color:C.inkSoft, marginBottom:8 }}>
                  O que foi digitado em "Outro"
                </div>
                {mg.outros.map(o => (
                  <div key={o.texto} style={{ display:"flex", gap:8, fontSize:12.5,
                                              color:C.inkSoft, padding:"4px 0" }}>
                    <span style={{ marginRight:"auto" }}>{o.texto}</span>
                    <strong>{o.n}</strong>
                  </div>
                ))}
              </div>
            )}
          </Card>

          {/* funil */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>Onde os leads estão parados</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              Distribuição dos {emAberto.length} leads ainda em aberto.
            </p>
            {emAberto.length === 0
              ? <p style={{ fontSize:13, color:C.muted }}>Nenhum lead em aberto no período.</p>
              : ESTAGIOS.map(s => {
                  const n = emAberto.filter(c => (c.estagio || "Novo lead") === s).length;
                  return n ? <Barra key={s} rotulo={s} valor={n} total={emAberto.length}
                                    cor={ESTAGIO_COR[s]} /> : null;
                })}
          </Card>

          {/* como o contato foi feito */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>Como falamos com os leads</div>
            <p style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              {porCanal.total} {porCanal.total === 1 ? "contato registrado" : "contatos registrados"} na
              cadência, somando todos os ciclos. A porcentagem é de tentativas em que a pessoa respondeu.
            </p>
            {porCanal.total === 0 ? (
              <p style={{ fontSize:13, color:C.muted }}>
                Nenhum contato registrado ainda. Ao marcar um follow-up como feito, o Zelo pergunta
                por qual meio foi e o que foi conversado.
              </p>
            ) : (
              <>
                {porCanal.lista.map(k => (
                  <Barra key={k.canal} rotulo={k.canal} valor={k.total} total={porCanal.total}
                         cor={CANAL_COR[k.canal] || C.muted}
                         extra={`${k.taxa}% com resposta`} />
                ))}
                {porCanal.semNota > 0 && (
                  <p style={{ fontSize:11.5, color:C.muted, marginTop:12, lineHeight:1.55 }}>
                    {porCanal.semNota} {porCanal.semNota === 1 ? "contato foi registrado" : "contatos foram registrados"}
                    {" "}sem anotação do que foi conversado.
                  </p>
                )}
              </>
            )}
          </Card>

          {/* resumo de ciclo */}
          <Card style={{ padding:20 }}>
            <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:16 }}>Ritmo e reaberturas</div>
            <div style={{ display:"grid", gap:14 }}>
              <div>
                <div style={{ fontSize:11.5, color:C.muted, marginBottom:3 }}>Tempo médio do cadastro ao contrato</div>
                <div className="fr" style={{ fontSize:22, fontWeight:700 }}>
                  {tempoMedio === null ? "—" : `${tempoMedio} dias`}
                </div>
              </div>
              <div>
                <div style={{ fontSize:11.5, color:C.muted, marginBottom:3 }}>Clientes reabertos</div>
                <div className="fr" style={{ fontSize:22, fontWeight:700 }}>{reabertos}</div>
                <div style={{ fontSize:11.5, color:C.muted, marginTop:3 }}>
                  Leads que voltaram ao funil depois de encerrados.
                </div>
              </div>
              {origensLivres.length > 0 && (
                <div>
                  <div style={{ fontSize:11.5, color:C.muted, marginBottom:6 }}>Origens digitadas em "Outro"</div>
                  {origensLivres.map(o => (
                    <div key={o.texto} style={{ display:"flex", gap:8, fontSize:12.5,
                                                color:C.inkSoft, padding:"3px 0" }}>
                      <span style={{ marginRight:"auto" }}>{o.texto}</span>
                      <strong>{o.n}</strong>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </Card>
        </div>
      </>
      )}
    </div>
  );
}

/* ================================================================= *
 *  USUÁRIOS — só o master
 * ================================================================= */
function Usuarios({ ctx }) {
  const { perfil } = ctx;
  const usuarios = useColecao("usuarios");
  const [novo, setNovo] = useState(false);
  const [editando, setEditando] = useState(null);
  const [aviso, setAviso] = useState("");

  const lista = usuarios.itens.slice().sort((a,b) => (a.nome || "").localeCompare(b.nome || ""));

  const alternarAtivo = (u) => {
    if (u.email === MASTER_EMAIL) return;
    usuarios.atualizar(u.id, { ativo: u.ativo === false });
  };

  const enviarReset = async (email) => {
    try {
      await auth.sendPasswordResetEmail(email);
      setAviso(`Link de redefinição enviado para ${email}.`);
    } catch { setAviso("Não foi possível enviar o link."); }
  };

  return (
    <div className="rise">
      <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:8 }}>
        <h1 className="fr" style={{ fontSize:26, fontWeight:700, marginRight:"auto" }}>Usuários</h1>
        <Btn kind="brass" icon={<Icon.plus size={16} />} onClick={() => setNovo(true)}>Novo usuário</Btn>
      </div>
      <p style={{ fontSize:12.5, color:C.muted, marginBottom:18, maxWidth:640, lineHeight:1.6 }}>
        Cada pessoa entra com o próprio e-mail e senha. Quem cria a conta define uma senha
        provisória e a pessoa troca no primeiro acesso pelo link de redefinição.
      </p>

      {aviso && (
        <div style={{ fontSize:13, color:C.ok, background:"#4F7A5C12", padding:"10px 13px",
                      borderRadius:9, marginBottom:14 }}>{aviso}</div>
      )}

      <div style={{ display:"grid", gap:10 }}>
        {lista.map(u => {
          const ehMaster = u.email === MASTER_EMAIL;
          const inativo = u.ativo === false;
          return (
            <Card key={u.id} style={{ padding:"14px 16px", display:"flex", gap:14,
                                      alignItems:"center", flexWrap:"wrap", opacity: inativo ? .6 : 1 }}>
              <div style={{ flex:1, minWidth:180 }}>
                <div style={{ fontSize:14.5, fontWeight:600 }}>{u.nome || "Sem nome"}</div>
                <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>{u.email}</div>
              </div>
              <Tag cor={ehMaster ? C.brass : C.inkSoft} forte={ehMaster}>{PAPEIS[u.papel] || u.papel}</Tag>
              {inativo && <Tag cor={C.late}>desativado</Tag>}
              <Btn kind="ghost" size="sm" onClick={() => enviarReset(u.email)}>Redefinir senha</Btn>
              {!ehMaster && (
                <>
                  <Btn kind="ghost" size="sm" onClick={() => setEditando(u)}>Permissões</Btn>
                  <Btn kind={inativo ? "ok" : "danger"} size="sm" onClick={() => alternarAtivo(u)}>
                    {inativo ? "Reativar" : "Desativar"}
                  </Btn>
                </>
              )}
            </Card>
          );
        })}
        {lista.length === 0 && <p style={{ fontSize:13, color:C.muted }}>Carregando…</p>}
      </div>

      <Card style={{ padding:18, marginTop:22 }}>
        <div className="fr" style={{ fontSize:16, fontWeight:700, marginBottom:10 }}>O que cada perfil pode fazer</div>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12.5, minWidth:460 }}>
            <thead>
              <tr style={{ color:C.muted }}>
                {["", "Master", "Advogado", "Secretária"].map(h => (
                  <th key={h} style={{ textAlign: h ? "center" : "left", padding:"6px 8px",
                                       borderBottom:`1px solid ${C.lineSoft}`, fontWeight:600 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                ["Clientes", "tudo", "tudo", "criar e editar"],
                ["Processos e prazos", "tudo", "tudo", "só visualizar"],
                ["Audiências", "tudo", "tudo", "criar e editar"],
                ["Funil", "tudo", "tudo", "mover, sem desfecho"],
                ["Relatórios", "tudo", "próprios", "não vê"],
                ["Usuários", "sim", "não", "não"]
              ].map(l => (
                <tr key={l[0]}>
                  <td style={{ padding:"7px 8px", borderBottom:`1px solid ${C.lineSoft}`, fontWeight:500 }}>{l[0]}</td>
                  {l.slice(1).map((v, i) => (
                    <td key={i} style={{ padding:"7px 8px", textAlign:"center", color:C.inkSoft,
                                         borderBottom:`1px solid ${C.lineSoft}` }}>{v}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      {novo && <NovoUsuario usuarios={usuarios} onFechar={() => setNovo(false)}
                            onOk={m => { setNovo(false); setAviso(m); }} />}
      {editando && <EditarUsuario u={editando} usuarios={usuarios} onFechar={() => setEditando(null)} />}
    </div>
  );
}

function NovoUsuario({ usuarios, onFechar, onOk }) {
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [papel, setPapel] = useState("secretaria");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const criar = async () => {
    setErro("");
    if (!nome.trim()) { setErro("Informe o nome da pessoa."); return; }
    if (!email.trim()) { setErro("Informe o e-mail de acesso."); return; }
    if (senha.length < 6) { setErro("A senha provisória precisa de pelo menos 6 caracteres."); return; }
    setSalvando(true);
    try {
      /* A segunda conexão evita que quem está cadastrando seja deslogado. */
      const cred = await appSec.auth().createUserWithEmailAndPassword(email.trim(), senha);
      await db.ref(`usuarios/${cred.user.uid}`).set({
        nome: nome.trim(), email: email.trim().toLowerCase(), papel,
        ativo: true, criadoEm: new Date().toISOString()
      });
      await appSec.auth().signOut();
      onOk(`Acesso criado para ${nome.trim()}. Peça para a pessoa entrar e trocar a senha.`);
    } catch (e) {
      const m = {
        "auth/email-already-in-use": "Já existe uma conta com este e-mail.",
        "auth/invalid-email": "E-mail inválido.",
        "auth/weak-password": "Senha muito fraca. Use 6 caracteres ou mais."
      }[e.code] || "Não foi possível criar o acesso.";
      setErro(m);
    }
    setSalvando(false);
  };

  return (
    <Modal titulo="Novo usuário" sub="A pessoa entra com este e-mail e a senha provisória"
           largura={600} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="brass" disabled={salvando} onClick={criar}>
                       {salvando ? "Criando…" : "Criar acesso"}</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Nome" obrig><Inp value={nome} onChange={e => setNome(e.target.value)}
                                       placeholder="Ana Paula Ribeiro" /></Campo>
        <Campo label="E-mail de acesso" obrig>
          <Inp type="email" value={email} onChange={e => setEmail(e.target.value)}
               placeholder="ana@escritorio.com.br" />
        </Campo>
        <Campo label="Senha provisória" obrig hint="Combine com a pessoa e peça para trocar no primeiro acesso.">
          <Inp type="text" value={senha} onChange={e => setSenha(e.target.value)} placeholder="mínimo 6 caracteres" />
        </Campo>
        <Campo label="Perfil">
          <Sel value={papel} onChange={e => setPapel(e.target.value)}>
            <option value="secretaria">Secretária</option>
            <option value="advogado">Advogado</option>
          </Sel>
        </Campo>
        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

function EditarUsuario({ u, usuarios, onFechar }) {
  const [nome, setNome] = useState(u.nome || "");
  const [papel, setPapel] = useState(u.papel || "secretaria");
  return (
    <Modal titulo="Permissões" sub={u.email} largura={540} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="brass" onClick={() => { usuarios.atualizar(u.id, { nome, papel }); onFechar(); }}>
                       Salvar</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Nome"><Inp value={nome} onChange={e => setNome(e.target.value)} /></Campo>
        <Campo label="Perfil">
          <Sel value={papel} onChange={e => setPapel(e.target.value)}>
            <option value="secretaria">Secretária</option>
            <option value="advogado">Advogado</option>
          </Sel>
        </Campo>
        <p style={{ fontSize:12, color:C.muted, lineHeight:1.6 }}>
          O perfil Master fica reservado a {MASTER_EMAIL} e não pode ser concedido por aqui.
        </p>
      </div>
    </Modal>
  );
}

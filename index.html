/* ---------------------------- datas ------------------------------ */
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
const diffDays = (iso, from = todayISO()) => Math.round((parseISO(iso) - parseISO(from)) / 86400000);
const fmtBR = iso => { if (!iso) return "—"; const [y,m,d] = String(iso).split("-"); return `${d}/${m}/${y}`; };
const fmtBRhora = iso => { if (!iso) return "—"; const dt = new Date(iso); return `${pad(dt.getDate())}/${pad(dt.getMonth()+1)} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const brl = v => v ? `R$ ${Number(v).toLocaleString("pt-BR")}` : "—";

const followStatus = iso => { if (!iso) return "futuro"; const d = diffDays(iso); return d < 0 ? "atrasado" : d === 0 ? "hoje" : "futuro"; };
const statusCor = s => s === "atrasado" ? C.late : s === "hoje" ? C.today : C.ok;

const prazoUrgencia = (iso, cumprido) => {

};
const URG_COR = { vencido:"#8A2E1C", critico:"#B4472E", atencao:"#9C7C3C", tranquilo:"#4F7A5C", cumprido:"#A6A69C" };

};

  return out;
};
const maskTel = v => {

/* ------------------- cadência de follow-up ----------------------- */
/* O escritório atende de segunda a sexta e não trabalha em feriado nacional. */

/* Domingo de Páscoa pelo algoritmo de Meeus/Jones/Butcher. */
const domingoDePascoa = (ano) => {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return `${ano}-${pad(mes)}-${pad(dia)}`;
};

const FERIADOS_FIXOS = [
  ["01-01", "Confraternização Universal"],
  ["04-21", "Tiradentes"],
  ["05-01", "Dia do Trabalho"],
  ["09-07", "Independência"],
  ["10-12", "Nossa Senhora Aparecida"],
  ["11-02", "Finados"],
  ["11-15", "Proclamação da República"],
  ["11-20", "Consciência Negra"],
  ["12-25", "Natal"]
];

const _feriadosCache = {};
const feriadosDoAno = (ano) => {
  if (_feriadosCache[ano]) return _feriadosCache[ano];
  const m = {};
  FERIADOS_FIXOS.forEach(([md, nome]) => { m[`${ano}-${md}`] = nome; });
  const pascoa = domingoDePascoa(ano);
  m[addDays(pascoa, -48)] = "Carnaval";
  m[addDays(pascoa, -47)] = "Carnaval";
  m[addDays(pascoa, -2)]  = "Sexta-feira Santa";
  m[addDays(pascoa, 60)]  = "Corpus Christi";
  _feriadosCache[ano] = m;
  return m;
};
const nomeDoFeriado = iso => feriadosDoAno(Number(String(iso).slice(0, 4)))[iso] || null;
const ehFeriado = iso => !!nomeDoFeriado(iso);
const ehFimDeSemana = iso => { const d = parseISO(iso).getDay(); return d === 0 || d === 6; };
const ehDiaUtil = iso => !ehFimDeSemana(iso) && !ehFeriado(iso);
const proximoDiaUtil = iso => { let d = iso, guarda = 0; while (!ehDiaUtil(d) && guarda++ < 30) d = addDays(d, 1); return d; };

/* D1 = um dia depois do início do ciclo (não o próprio dia). */
const gerarFollowups = (inicioISO) => {
  let anterior = null;
  return CADENCIA.map(n => {
    let data = proximoDiaUtil(addDays(inicioISO, n));
    /* dois contatos empurrados para o mesmo dia viram um só na prática:
       o seguinte anda para o próximo dia útil. */
    if (anterior && data <= anterior) data = proximoDiaUtil(addDays(anterior, 1));
    anterior = data;
    return { dia: n, data, feito: false, feitoEm: null,
             canal: "", semResposta: false, canalOutro: "", nota: "" };
  });
};

/* Reposiciona contatos ainda em aberto que caíram em dia não útil. */
const ajustarParaDiasUteis = (fups) => {
  if (!Array.isArray(fups)) return { lista: fups, mudou: 0 };
  let mudou = 0, anterior = null;
  const lista = fups.map(f => {
    if (f.feito) { anterior = f.data; return f; }
    let data = proximoDiaUtil(f.data);
    if (anterior && data <= anterior) data = proximoDiaUtil(addDays(anterior, 1));
    anterior = data;
    if (data !== f.data) mudou++;
    return { ...f, data };
  });
  return { lista, mudou };
};

const contarNaoUteis = (clientes) => {
  let n = 0;
  clientes.filter(c => !c.desfecho).forEach(c => {
    (Array.isArray(c.followups) ? c.followups : [])
      .forEach(f => { if (!f.feito && !ehDiaUtil(f.data)) n++; });
  });
  return n;
};

const proximoFollowup = (fups) => {
  if (!Array.isArray(fups)) return null;
  return fups.filter(f => !f.feito).sort((a,b) => a.data < b.data ? -1 : 1)[0] || null;
};

  return <button {...r} style={{ ...base, ...kinds[kind], ...(r.style||{}) }}>{icon}{children}</button>;
}

/* Modal com rolagem interna — cabeçalho e rodapé sempre visíveis.
   Renderizado via portal direto no <body>: qualquer ancestral com transform
   (as animações de entrada das abas, por exemplo) viraria o quadro de
   referência do position:fixed e recortaria o modal. */
function Modal({ titulo, sub, onFechar, children, rodape, largura = 720 }) {
  useEffect(() => {
    const before = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const esc = e => { if (e.key === "Escape") onFechar(); };
    window.addEventListener("keydown", esc);
    return () => { document.body.style.overflow = before; window.removeEventListener("keydown", esc); };
  }, [onFechar]);

  const conteudo = (
    <div className="mdl-bg" onMouseDown={e => { if (e.target === e.currentTarget) onFechar(); }}>
      <div className="mdl rise" style={{ maxWidth: largura }} role="dialog" aria-modal="true">

                  style={{ background:"transparent", border:"none", padding:6, color:C.muted, flexShrink:0 }}>

        </div>
        <div className="mdl-body">{children}</div>
        {rodape && <div className="mdl-foot">{rodape}</div>}
      </div>
    </div>
  );

  return ReactDOM.createPortal(conteudo, document.body);
}

/* O navegador pode bloquear o armazenamento local (aba anônima, política
   corporativa). Nesses casos o controle continua valendo só em memória. */
const lerGuardado    = k => { try { return window.localStorage.getItem(k); } catch (e) { return null; } };
const guardar        = (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) {} };
const apagarGuardado = k => { try { window.localStorage.removeItem(k); } catch (e) {} };

/* --------------------------- paginação --------------------------- */
const POR_PAGINA = [10, 25, 50, 100];

function usePaginacao(itens, chave) {
  const [porPagina, setPorPagina] = useState(25);
  const [pagina, setPagina] = useState(1);
  /* qualquer mudança de filtro ou de tamanho volta para a primeira página */
  useEffect(() => { setPagina(1); }, [chave, porPagina]);

  const total = itens.length;
  const tudo = porPagina === "todos";
  const paginas = tudo ? 1 : Math.max(1, Math.ceil(total / porPagina));
  const atual = Math.min(pagina, paginas);
  const inicio = tudo ? 0 : (atual - 1) * porPagina;
  const fatia = tudo ? itens : itens.slice(inicio, inicio + porPagina);
  return { fatia, total, pagina: atual, paginas, setPagina,
           porPagina, setPorPagina, primeiro: total ? inicio + 1 : 0,
           ultimo: tudo ? total : Math.min(inicio + porPagina, total) };
}

function Paginacao({ p, rotulo = "registros" }) {
  if (p.total === 0) return null;
  const botao = (texto, destino, ativo, desabilitado) => (
    <button key={texto + destino} disabled={desabilitado}
            onClick={() => p.setPagina(destino)}
            style={{ minWidth:32, height:32, padding:"0 9px", borderRadius:8, fontSize:13,
                     fontWeight: ativo ? 700 : 500,
                     border:`1px solid ${ativo ? C.brass : C.line}`,
                     background: ativo ? C.brass : "#fff",
                     color: ativo ? "#fff" : desabilitado ? C.line : C.inkSoft,
                     cursor: desabilitado ? "not-allowed" : "pointer" }}>{texto}</button>
  );

  /* janela de páginas em volta da atual, para não virar uma régua enorme */
  const nums = [];
  const de = Math.max(1, Math.min(p.pagina - 2, p.paginas - 4));
  const ate = Math.min(p.paginas, Math.max(p.pagina + 2, 5));
  for (let i = de; i <= ate; i++) nums.push(i);

  return (
    <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap",
                  marginTop:16, paddingTop:14, borderTop:`1px solid ${C.lineSoft}` }}>
      <span style={{ fontSize:12.5, color:C.muted, marginRight:"auto" }}>
        Mostrando {p.primeiro}–{p.ultimo} de {p.total} {rotulo}
      </span>

      {p.paginas > 1 && (
        <div style={{ display:"flex", gap:5, alignItems:"center", flexWrap:"wrap" }}>
          {botao("‹", p.pagina - 1, false, p.pagina === 1)}
          {de > 1 && <span style={{ fontSize:12, color:C.muted }}>…</span>}
          {nums.map(n => botao(String(n), n, n === p.pagina, false))}
          {ate < p.paginas && <span style={{ fontSize:12, color:C.muted }}>…</span>}
          {botao("›", p.pagina + 1, false, p.pagina === p.paginas)}
        </div>
      )}

      <label style={{ display:"flex", alignItems:"center", gap:7, fontSize:12.5, color:C.muted }}>
        Por página
        <Sel value={String(p.porPagina)}
             onChange={e => p.setPorPagina(e.target.value === "todos" ? "todos" : Number(e.target.value))}
             style={{ width:"auto", padding:"6px 9px", fontSize:12.5 }}>
          {POR_PAGINA.map(n => <option key={n} value={n}>{n}</option>)}
          <option value="todos">Todos</option>
        </Sel>
      </label>
    </div>
  );
}

 *  ACESSO AO BANCO
 * ================================================================= */
function useColecao(path, ativo = true) {
  const [itens, setItens] = useState([]);
  const [carregando, setCarregando] = useState(true);
  useEffect(() => {
    if (!ativo || !db) { setCarregando(false); return; }
    const ref = db.ref(path);
    const cb = ref.on("value", snap => {
      const v = snap.val() || {};
      setItens(Object.keys(v).map(id => ({ id, ...v[id] })));
      setCarregando(false);
    }, () => setCarregando(false));
    return () => ref.off("value", cb);
  }, [path, ativo]);

  const criar    = obj      => db.ref(path).push(obj);
  const atualizar = (id, obj) => db.ref(`${path}/${id}`).update(obj);
  const remover  = id       => db.ref(`${path}/${id}`).remove();
  return { itens, carregando, criar, atualizar, remover };
}

 *  RAIZ — porta de autenticação
 * ================================================================= */
function App() {
  const [user, setUser] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [pronto, setPronto] = useState(false);
  const [erroPerfil, setErroPerfil] = useState("");

  useEffect(() => {
    if (!configOK) { setPronto(true); return; }
    return auth.onAuthStateChanged(async u => {
      setUser(u);
      if (!u) { setPerfil(null); setPronto(true); return; }
      try {
        const snap = await db.ref(`usuarios/${u.uid}`).get();
        let p = snap.val();
        /* Primeiro acesso do master: cria o próprio registro. */
        if (!p && u.email === MASTER_EMAIL) {
          p = { email: u.email, nome: "Master", papel: "master", ativo: true, criadoEm: new Date().toISOString() };
          await db.ref(`usuarios/${u.uid}`).set(p);
        }
        if (!p) { setErroPerfil("semcadastro"); setPerfil(null); }
        else if (p.ativo === false) { setErroPerfil("inativo"); setPerfil(null); }
        else { setErroPerfil(""); setPerfil({ uid: u.uid, ...p }); }
      } catch (e) {
        setErroPerfil("erro");
      }
      setPronto(true);
    });
  }, []);

  if (!configOK) return <SetupScreen />;
  if (!pronto) return <Splash />;
  if (!user) return <Login />;
  if (!perfil) return <SemAcesso motivo={erroPerfil} email={user.email} />;
  return <Workspace user={user} perfil={perfil} />;
}

function Login() {

  const [aviso, setAviso] = useState("");
  const [expirou, setExpirou] = useState(() => lerGuardado(CHAVE_EXPIRADA) === "1");

  const entrar = async () => {
    setErro(""); setAviso("");
    if (!email || !senha) { setErro("Preencha e-mail e senha."); return; }
    setCarregando(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
      apagarGuardado(CHAVE_EXPIRADA);
      guardar(CHAVE_ATIVIDADE, String(Date.now()));
    } catch (e) {
      const m = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Não existe conta com este e-mail.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos.",
        "auth/user-disabled": "Esta conta está desativada."
      }[e.code] || "Não foi possível entrar. Tente novamente.";
      setErro(m);
    }
    setCarregando(false);
  };

  const enviarReset = async () => {
    setErro(""); setAviso("");
    if (!email) { setErro("Digite o e-mail para receber o link."); return; }
    setCarregando(true);
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setAviso("Link de redefinição enviado. Confira a caixa de entrada.");
      setRecuperar(false);
    } catch (e) { setErro("Não foi possível enviar o link para este e-mail."); }

    <div style={{ minHeight:"100dvh", display:"grid", gridTemplateColumns:"1fr", placeItems:"center",

                   onChange={e => { setEmail(e.target.value); setExpirou(false); }}
                   onKeyDown={e => e.key === "Enter" && (recuperar ? enviarReset() : entrar())}
                   placeholder="voce@escritorio.com.br" />
            </Campo>
            {!recuperar && (
              <Campo label="Senha">
                <Inp type="password" value={senha} autoComplete="current-password"
                     onChange={e => setSenha(e.target.value)}
                     onKeyDown={e => e.key === "Enter" && entrar()} placeholder="••••••••" />

  emAberto.forEach(c => {
    const p = proximoFollowup(c.followups);
    if (p && diffDays(p.data) <= 0) fups.push({ cliente:c, fup:p });
  });
  fups.sort((a,b) => a.fup.data < b.fup.data ? -1 : 1);

  const prazos = [];
  processos.itens.forEach(pr => {
    (pr.prazos || []).forEach((pz, i) => {
      if (!pz.cumprido && diffDays(pz.data) <= 7) prazos.push({ proc:pr, prazo:pz, i });
    });
  });
  prazos.sort((a,b) => a.prazo.data < b.prazo.data ? -1 : 1);

  const proxEventos = eventos.itens
    .filter(e => e.data >= hoje).sort((a,b) => a.data < b.data ? -1 : 1).slice(0, 5);

  const ganhos = clientes.itens.filter(c => c.desfecho === "ganho").length;
  const perdidos = clientes.itens.filter(c => c.desfecho === "perdido").length;

  const num = [
    { r:"Leads em aberto", v:emAberto.length, cor:C.ink },
    { r:"Contatos para hoje", v:fups.length, cor: fups.length ? C.late : C.ok },
    { r:"Prazos em 7 dias", v:prazos.length, cor: prazos.length ? C.brass : C.ok },
    { r:"Contratos fechados", v:ganhos, cor:C.ok }
  ];

  return (
    <div className="rise">
      <h1 className="fr" style={{ fontSize:26, fontWeight:700, marginBottom:4 }}>
        {saudacao()}, {(perfil.nome || "").split(" ")[0] || "bem-vindo"}
      </h1>
      <p style={{ fontSize:13.5, color:C.muted, marginBottom:22 }}>
        {new Date().toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long" })}
      </p>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",
                    gap:12, marginBottom:24 }}>
        {num.map(n => (
          <Card key={n.r} style={{ padding:"16px 18px" }}>
            <div className="fr" style={{ fontSize:30, fontWeight:700, color:n.cor, lineHeight:1.1 }}>{n.v}</div>
            <div style={{ fontSize:12, color:C.muted, marginTop:4 }}>{n.r}</div>
          </Card>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:16 }}>
        <Card style={{ padding:18 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
            <Icon.bell size={17} color={C.brass} />
            <div className="fr" style={{ fontSize:16, fontWeight:700 }}>Contatos de hoje</div>
          </div>
          {fups.length === 0
            ? <p style={{ fontSize:13, color:C.muted }}>Nenhum contato pendente. Cadência em dia.</p>
            : fups.slice(0, 6).map(({ cliente, fup }) => (
                <button key={cliente.id + fup.dia} onClick={() => irPara("followup")}
                        style={{ width:"100%", textAlign:"left", background:"transparent",
                                 border:"none", borderBottom:`1px solid ${C.lineSoft}`,
                                 padding:"10px 0", display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13.5, fontWeight:600, overflow:"hidden",
                                  textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{cliente.nome}</div>
                    <div style={{ fontSize:11.5, color:C.muted }}>
                      D{fup.dia} · {cliente.telefone || cliente.email || "sem contato"}
                    </div>
                  </div>
                  <Tag cor={statusCor(followStatus(fup.data))}>
                    {followStatus(fup.data) === "atrasado" ? `${Math.abs(diffDays(fup.data))}d atrás` : "hoje"}
                  </Tag>
                </button>
              ))}
        </Card>

        <Card style={{ padding:18 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
            <Icon.folder size={17} color={C.late} />
            <div className="fr" style={{ fontSize:16, fontWeight:700 }}>Prazos próximos</div>
          </div>
          {prazos.length === 0
            ? <p style={{ fontSize:13, color:C.muted }}>Nenhum prazo nos próximos 7 dias.</p>
            : prazos.slice(0, 6).map(({ proc, prazo, i }) => {
                const u = prazoUrgencia(prazo.data, prazo.cumprido);
                return (
                  <div key={proc.id + i} style={{ borderBottom:`1px solid ${C.lineSoft}`, padding:"10px 0",
                                                  display:"flex", alignItems:"center", gap:10 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13.5, fontWeight:600 }}>{prazo.titulo}</div>
                      <div style={{ fontSize:11.5, color:C.muted, overflow:"hidden",

                    </div>

              })}

          </div>

            ? <p style={{ fontSize:13, color:C.muted }}>Agenda livre.</p>
            : proxEventos.map(e => (
                <div key={e.id} style={{ borderBottom:`1px solid ${C.lineSoft}`, padding:"10px 0",
                                         display:"flex", alignItems:"center", gap:10 }}>

                    <div style={{ fontSize:13.5, fontWeight:600 }}>{e.titulo}</div>
                    <div style={{ fontSize:11.5, color:C.muted }}>{fmtBR(e.data)} {e.hora || ""}</div>

                </div>
              ))}
        </Card>
      </div>
    </div>
  );

/* ------------------ controle de inatividade ---------------------- */
function ControleInatividade({ onSair }) {
  const [restante, setRestante] = useState(null);
  const ultima = useRef(Date.now());
  const encerrando = useRef(false);

  const renovar = () => {
    ultima.current = Date.now();
    guardar(CHAVE_ATIVIDADE, String(ultima.current));
    setRestante(null);
  };

  useEffect(() => {
    /* Retoma o carimbo salvo: recarregar a página ou abrir outra aba não
       zera a contagem. A folga evita que um carimbo antigo derrube a sessão
       no instante em que ela abre — proporcional ao limite, nunca à frente
       do relógio atual. */
    const salvo = Number(lerGuardado(CHAVE_ATIVIDADE));
    const limite = MINUTOS_INATIVIDADE * 60000;
    const folga = Math.min(60000, limite / 2);
    ultima.current = salvo > 0
      ? Math.min(Date.now(), Math.max(salvo, Date.now() - limite + folga))
      : Date.now();
    guardar(CHAVE_ATIVIDADE, String(ultima.current));

    /* mousemove ficou de fora de propósito: um esbarrão no mouse não deveria
       manter a sessão viva a noite inteira. Exige uso de verdade. */
    const eventos = ["mousedown", "keydown", "touchstart", "wheel"];
    const aoUsar = () => { if (!encerrando.current) renovar(); };
    eventos.forEach(e => window.addEventListener(e, aoUsar, { passive: true }));

    /* Compara relógio em vez de encadear timers: se a máquina hibernar,
       o tempo parado conta do mesmo jeito quando ela acordar. */
    const tique = setInterval(() => {
      if (encerrando.current) return;
      /* outra aba pode ter registrado uso mais recente */
      const deOutraAba = Number(lerGuardado(CHAVE_ATIVIDADE)) || 0;
      ultima.current = Math.max(ultima.current, deOutraAba);

      const parado = Date.now() - ultima.current;
      if (parado >= limite) {
        encerrando.current = true;
        guardar(CHAVE_EXPIRADA, "1");
        apagarGuardado(CHAVE_ATIVIDADE);
        onSair();
      } else if (parado >= limite - SEGUNDOS_AVISO * 1000) {
        setRestante(Math.ceil((limite - parado) / 1000));
      } else {
        setRestante(r => (r === null ? r : null));
      }
    }, 1000);

    return () => {
      clearInterval(tique);
      eventos.forEach(e => window.removeEventListener(e, aoUsar));
    };
  }, [onSair]);

  if (restante === null) return null;

  const minutos = Math.floor(restante / 60);
  const segundos = restante % 60;

  return (
    <Modal titulo="Ainda está aí?" largura={460}
           sub="A sessão está prestes a ser encerrada por inatividade"
           onFechar={renovar}
           rodape={<><Btn kind="ghost" onClick={() => { apagarGuardado(CHAVE_ATIVIDADE); onSair(); }}>
                       Sair agora</Btn>
                     <Btn kind="brass" onClick={renovar}>Continuar conectado</Btn></>}>
      <div style={{ textAlign:"center", padding:"10px 0 4px" }}>
        <div className="fr" style={{ fontSize:44, fontWeight:700, lineHeight:1.1,
                                     color: restante <= 30 ? C.late : C.brass }}>
          {minutos > 0 ? `${minutos}:${pad(segundos)}` : segundos}
        </div>
        <div style={{ fontSize:13, color:C.muted, marginTop:6 }}>
          {minutos > 0 ? "para o encerramento"
            : segundos === 1 ? "segundo para o encerramento" : "segundos para o encerramento"}
        </div>
        <p style={{ fontSize:12.5, color:C.inkSoft, lineHeight:1.6, marginTop:16 }}>
          O Zelo desconecta após {MINUTOS_INATIVIDADE} minutos sem uso, para proteger os dados
          dos clientes em computador compartilhado. Cadastros abertos e não salvos serão perdidos.
        </p>
      </div>
    </Modal>
  );
}

/* ------------------- formulário de cliente ----------------------- */
function ClienteForm({ ctx, cliente, onFechar }) {
  const { clientes, perfil } = ctx;
  const ed = !!cliente;
  const [f, setF] = useState(() => cliente ? { ...cliente } : {
    nome:"", telefone:"", email:"", cpf:"", area:"", origem:"", origemOutro:"",
    estagio:"Novo lead", valorProposta:"", observacoes:"", inicioCadencia: todayISO()
  });
  const [erro, setErro] = useState("");
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const salvar = () => {
    if (!f.nome.trim()) { setErro("O nome do cliente é obrigatório."); return; }
    if (!f.origem) { setErro("Informe de onde veio este lead — é o que alimenta o relatório de origem."); return; }
    if (f.origem === "Outro" && !String(f.origemOutro || "").trim()) {
      setErro("Descreva a origem no campo livre."); return;
    }
    const dados = {
      nome: f.nome.trim(), telefone: f.telefone || "", email: f.email || "", cpf: f.cpf || "",
      area: f.area || "", origem: f.origem, origemOutro: f.origem === "Outro" ? f.origemOutro.trim() : "",
      estagio: f.estagio || "Novo lead",
      valorProposta: f.valorProposta ? Number(String(f.valorProposta).replace(/\D/g, "")) : "",
      observacoes: f.observacoes || ""
    };
    if (ed) {
      clientes.atualizar(cliente.id, dados);
    } else {
      const inicio = f.inicioCadencia || todayISO();
      clientes.criar({
        ...dados, criadoEm: new Date().toISOString(), criadoPor: perfil.uid,
        responsavel: perfil.uid, ciclo: 1, inicioCiclo: inicio,
        followups: gerarFollowups(inicio), desfecho: null, historicoCiclos: []
      });
    }
    onFechar();
  };

  return (
    <Modal titulo={ed ? "Editar cliente" : "Novo cliente"} largura={860}
           sub={ed ? f.nome : "A cadência de contato começa no dia seguinte ao cadastro"}
           onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="brass" onClick={salvar}>{ed ? "Salvar alterações" : "Cadastrar cliente"}</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Nome completo" obrig>
          <Inp value={f.nome} onChange={e => set("nome", e.target.value)} placeholder="Maria Aparecida da Silva" />
        </Campo>

        <div className="grid3">
          <Campo label="Telefone / WhatsApp">
            <Inp value={f.telefone} onChange={e => set("telefone", maskTel(e.target.value))} placeholder="(11) 90000-0000" />
          </Campo>
          <Campo label="E-mail">
            <Inp type="email" value={f.email} onChange={e => set("email", e.target.value)} placeholder="maria@email.com" />
          </Campo>
          <Campo label="CPF / CNPJ">
            <Inp value={f.cpf} onChange={e => set("cpf", e.target.value)} placeholder="opcional" />
          </Campo>
        </div>

        <div className="grid3">
          <Campo label="Área do caso">
            <Sel value={f.area} onChange={e => set("area", e.target.value)}>
              <option value="">Selecione…</option>
              {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
            </Sel>
          </Campo>
          <Campo label="Etapa do funil">
            <Sel value={f.estagio} onChange={e => set("estagio", e.target.value)}>
              {ESTAGIOS.map(s => <option key={s} value={s}>{s}</option>)}
            </Sel>
          </Campo>
          <Campo label="Valor da proposta">
            <Inp value={f.valorProposta} onChange={e => set("valorProposta", e.target.value.replace(/\D/g, ""))}
                 placeholder="R$ 0" inputMode="numeric" />
          </Campo>
        </div>

        <div className="grid2">
          <SelectComOutro label="Origem do lead" obrig opcoes={ORIGENS}
            hint="De onde essa pessoa chegou até o escritório."
            valor={f.origem} outro={f.origemOutro}
            placeholder="Ex.: indicação do contador"
            onChange={(v, o) => setF(p => ({ ...p, origem:v, origemOutro:o }))} />

          {!ed && (
            <Campo label="Início da cadência" hint="D1, D3, D5, D7, D15 e D28 contados a partir desta data.">
              <Inp type="date" value={f.inicioCadencia} onChange={e => set("inicioCadencia", e.target.value)} />
            </Campo>
          )}
        </div>

        <Campo label="Observações">
          <Txt value={f.observacoes} onChange={e => set("observacoes", e.target.value)}
               placeholder="Resumo do caso, o que foi combinado, pontos de atenção…" />
        </Campo>

        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

             onFechar={onFechar}
             rodape={<>
               {perfil.papel === "master" && (
                 <Btn kind="danger" icon={<Icon.trash size={15} />} style={{ marginRight:"auto" }}
                      onClick={() => setExcluirAberto(true)}>Excluir</Btn>
               )}
               {podeEditar && <Btn kind="ghost" icon={<Icon.edit size={15} />} onClick={() => onEditar(c)}>Editar</Btn>}
               {!encerrado && P.desfecho && (
                 <>
                   <Btn kind="danger" onClick={() => setDesfechoAberto("perdido")}>Marcar perdido</Btn>
                   <Btn kind="ok" icon={<Icon.check size={15} />} onClick={() => setDesfechoAberto("ganho")}>Marcar ganho</Btn>
                 </>
               )}
               {encerrado && P.desfecho && (
                 <Btn kind="brass" icon={<Icon.reopen size={15} />} onClick={() => setReabrirAberto(true)}>
                   Reabrir cliente
                 </Btn>
               )}
             </>}>

        {/* faixa de desfecho */}
        {encerrado && (
          <div style={{ padding:"14px 16px", borderRadius:12, marginBottom:18,
                        background: c.desfecho === "ganho" ? "#4F7A5C12" : "#B4472E12",
                        border:`1px solid ${c.desfecho === "ganho" ? "#4F7A5C33" : "#B4472E33"}` }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
              <Tag cor={c.desfecho === "ganho" ? C.ok : C.late} forte>
                {c.desfecho === "ganho" ? "Ganho" : "Perdido"}
              </Tag>
              <span style={{ fontSize:12, color:C.muted }}>em {fmtBR((c.desfechoEm || "").slice(0,10))}</span>
            </div>
            <div style={{ fontSize:13.5, color:C.inkSoft }}>
              Motivo: <strong>{rotulo(c.motivo, c.motivoOutro)}</strong>
            </div>
            {c.desfechoNota && (
              <div style={{ fontSize:12.5, color:C.muted, marginTop:5 }}>{c.desfechoNota}</div>
            )}
            <div style={{ fontSize:11.5, color:C.muted, marginTop:8 }}>
              A cadência de contato foi encerrada. Reabrir cria um novo ciclo e recomeça em D1.
            </div>
          </div>
        )}

        {/* dados */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",
                      gap:12, marginBottom:20 }}>
          {[["Telefone", c.telefone], ["E-mail", c.email], ["Etapa", c.estagio],
            ["Proposta", brl(c.valorProposta)], ["Cadastro", fmtBR((c.criadoEm || "").slice(0,10))]]
            .map(([r, v]) => (
              <div key={r}>
                <div style={{ fontSize:11, color:C.muted, marginBottom:2 }}>{r}</div>
                <div style={{ fontSize:13.5, fontWeight:500, wordBreak:"break-word" }}>{v || "—"}</div>
              </div>
            ))}
        </div>

        {c.observacoes && (
          <div style={{ marginBottom:20 }}>
            <div style={{ fontSize:11, color:C.muted, marginBottom:4 }}>Observações</div>
            <div style={{ fontSize:13.5, lineHeight:1.6, color:C.inkSoft, whiteSpace:"pre-wrap" }}>{c.observacoes}</div>
          </div>
        )}

        {/* cadência */}
        <div className="fr" style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>
          Cadência de contato{c.ciclo > 1 ? ` · ${c.ciclo}º ciclo` : ""}
        </div>
        <div style={{ fontSize:11.5, color:C.muted, marginBottom:12 }}>
          Início em {fmtBR(c.inicioCiclo)} · D1, D3, D5, D7, D15 e D28
        </div>

        <div style={{ display:"grid", gap:8, marginBottom:20, opacity: encerrado ? .55 : 1 }}>
          {fups.map((f, i) => {
            const st = followStatus(f.data);
            const canal = f.canal === "Outro" ? (f.canalOutro || "Outro") : f.canal;
            return (
              <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:12,
                    padding:"11px 12px", borderRadius:10, background: f.feito ? "#F5F6F4" : "#fff",
                    border:`1px solid ${C.lineSoft}` }}>
                <button disabled={encerrado || !podeEditar}
                        onClick={() => f.feito ? desfazerRegistro(i) : setRegistro({ indice:i, fup:f })}
                        aria-label={f.feito ? "Desfazer registro" : "Registrar contato"}
                        style={{ width:22, height:22, borderRadius:6, flexShrink:0, marginTop:1,
                                 border:`1.5px solid ${f.feito ? (f.semResposta ? C.brass : C.ok) : C.line}`,
                                 background: f.feito ? (f.semResposta ? C.brass : C.ok) : "#fff",
                                 display:"grid", placeItems:"center",
                                 cursor: encerrado || !podeEditar ? "not-allowed" : "pointer" }}>
                  {f.feito && <Icon.check size={13} color="#fff" />}
                </button>

                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <span style={{ fontSize:13.5, fontWeight:600, color: f.feito ? C.inkSoft : C.ink }}>
                      D{f.dia} — {fmtBR(f.data)}
                    </span>
                    {f.feito && canal && <Tag cor={CANAL_COR[f.canal] || C.muted}>{canal}</Tag>}
                    {f.feito && f.semResposta && <Tag cor={C.brass}>sem resposta</Tag>}
                    {!f.feito && !encerrado && <Tag cor={statusCor(st)}>{URG_LABEL(f.data, false)}</Tag>}
                  </div>

                  {f.feito && (
                    <>
                      {f.nota
                        ? <div style={{ fontSize:12.5, color:C.inkSoft, marginTop:5, lineHeight:1.55,
                                        whiteSpace:"pre-wrap" }}>{f.nota}</div>
                        : <div style={{ fontSize:12, color:C.muted, marginTop:5, fontStyle:"italic" }}>
                            Sem anotação do que foi conversado.
                          </div>}
                      <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:6 }}>
                        <span style={{ fontSize:11, color:C.muted }}>
                          registrado em {fmtBRhora(f.feitoEm)}
                        </span>
                        {!encerrado && podeEditar && (
                          <button onClick={() => setRegistro({ indice:i, fup:f })}
                                  style={{ background:"none", border:"none", padding:0, fontSize:11,
                                           color:C.brass, fontWeight:600 }}>editar</button>
                        )}
                      </div>
                    </>
                  )}

                  {!f.feito && !encerrado && podeEditar && (
                    <button onClick={() => setRegistro({ indice:i, fup:f })}
                            style={{ background:"none", border:"none", padding:0, fontSize:11.5,
                                     color:C.brass, fontWeight:600, marginTop:5 }}>
                      Registrar contato
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* histórico de ciclos anteriores */}
        {Array.isArray(c.historicoCiclos) && c.historicoCiclos.length > 0 && (
          <>
            <div className="fr" style={{ fontSize:16, fontWeight:700, marginBottom:10 }}>Ciclos anteriores</div>
            <div style={{ display:"grid", gap:8, marginBottom:20 }}>
              {c.historicoCiclos.map((h, i) => (
                <div key={i} style={{ padding:"11px 13px", borderRadius:10, background:"#F5F6F4",
                                      border:`1px solid ${C.lineSoft}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <Tag cor={h.desfecho === "ganho" ? C.ok : C.late}>
                      {h.ciclo}º ciclo · {h.desfecho === "ganho" ? "ganho" : "perdido"}
                    </Tag>
                    <span style={{ fontSize:11.5, color:C.muted }}>
                      {fmtBR(h.inicio)} → {fmtBR((h.fim || "").slice(0,10))}
                    </span>
                  </div>
                  <div style={{ fontSize:12.5, color:C.inkSoft, marginTop:5 }}>
                    {rotulo(h.motivo, h.motivoOutro)}
                  </div>
                </div>
              ))}
            </div>
          </>
        )}

        {procs.length > 0 && (
          <>
            <div className="fr" style={{ fontSize:16, fontWeight:700, marginBottom:10 }}>Processos vinculados</div>
            <div style={{ display:"grid", gap:8 }}>
              {procs.map(p => (
                <div key={p.id} style={{ padding:"11px 13px", borderRadius:10, border:`1px solid ${C.lineSoft}` }}>
                  <div style={{ fontSize:13.5, fontWeight:600 }}>{p.titulo}</div>
                  <div style={{ fontSize:11.5, color:C.muted }}>{p.numero || "sem número"} · {p.vara || "—"}</div>
                </div>
              ))}
            </div>
          </>
        )}
      </Modal>

      {desfechoAberto && (
        <DesfechoModal tipo={desfechoAberto} cliente={c} ctx={ctx}
                       onFechar={() => setDesfechoAberto(null)} />
      )}
      {reabrirAberto && (
        <ReabrirModal cliente={c} ctx={ctx} onFechar={() => setReabrirAberto(false)} />
      )}
      {excluirAberto && (
        <ExcluirClienteModal cliente={c} ctx={ctx}
                             onFechar={() => setExcluirAberto(false)}
                             onExcluido={onFechar} />
      )}
      {registro && (
        <RegistroContatoModal cliente={c} indice={registro.indice} fup={registro.fup}
                              onSalvar={dados => { salvarRegistro(registro.indice, dados); setRegistro(null); }}
                              onFechar={() => setRegistro(null)} />
      )}
    </>
  );
}

/* -------------- registro de um contato da cadência --------------- */
function RegistroContatoModal({ cliente, indice, fup, onSalvar, onFechar }) {
  const jaRegistrado = !!fup.feito;
  const [canal, setCanal] = useState(fup.canal || "WhatsApp");
  const [canalOutro, setCanalOutro] = useState(fup.canalOutro || "");
  const [semResposta, setSemResposta] = useState(!!fup.semResposta);
  const [nota, setNota] = useState(fup.nota || "");
  const [erro, setErro] = useState("");

  const confirmar = () => {
    if (!canal) { setErro("Escolha como o contato foi feito."); return; }
    if (canal === "Outro" && !canalOutro.trim()) { setErro("Descreva o meio no campo livre."); return; }
    if (!semResposta && !nota.trim()) {
      setErro("Anote o que foi conversado. Se ninguém atendeu, marque a opção acima.");
      return;
    }
    onSalvar({
      feito: true,
      feitoEm: fup.feitoEm || new Date().toISOString(),
      canal,
      canalOutro: canal === "Outro" ? canalOutro.trim() : "",
      semResposta,
      nota: nota.trim()
    });
  };

  return (
    <Modal titulo={jaRegistrado ? `Editar o contato D${fup.dia}` : `Registrar o contato D${fup.dia}`}
           sub={`${cliente.nome} · previsto para ${fmtBR(fup.data)}`} largura={640} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="brass" onClick={confirmar}>
                       {jaRegistrado ? "Salvar alterações" : "Registrar contato"}</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Como você falou com a pessoa?" obrig>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {CANAIS.map(op => {
              const at = canal === op;
              return (
                <button key={op} onClick={() => setCanal(op)}
                        style={{ padding:"8px 14px", borderRadius:9, fontSize:13, fontWeight:600,
                                 border:`1px solid ${at ? (CANAL_COR[op] || C.brass) : C.line}`,
                                 background: at ? (CANAL_COR[op] || C.brass) : "#fff",
                                 color: at ? "#fff" : C.inkSoft }}>{op}</button>
              );
            })}
          </div>
        </Campo>

        {canal === "Outro" && (
          <div className="rise" style={{ paddingLeft:12, borderLeft:`2px solid ${C.brassSoft}` }}>
            <Campo label="Qual?" obrig>
              <Inp value={canalOutro} onChange={e => setCanalOutro(e.target.value)} maxLength={40}
                   autoFocus placeholder="Ex.: recado com a filha" />
            </Campo>
          </div>
        )}

        <label style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"11px 13px",
                        background:"#F5F6F4", borderRadius:10, cursor:"pointer" }}>
          <input type="checkbox" checked={semResposta} style={{ marginTop:2 }}
                 onChange={e => setSemResposta(e.target.checked)} />
          <span>
            <span style={{ fontSize:13.5, fontWeight:600, display:"block" }}>Não consegui falar</span>
            <span style={{ fontSize:12, color:C.muted }}>
              Tentativa sem resposta. O contato conta como feito e a cadência segue para o próximo dia.
            </span>
          </span>
        </label>

        <Campo label={semResposta ? "Observação" : "O que foi conversado"}
               obrig={!semResposta}
               hint={semResposta
                 ? "Opcional. Ex.: caixa postal, telefone fora de área."
                 : "O que a pessoa disse, o que ficou combinado, qual o próximo passo."}>
          <Txt value={nota} onChange={e => setNota(e.target.value)} style={{ minHeight:110 }}
               placeholder={semResposta
                 ? "Ligou e caiu na caixa postal."
                 : "Ex.: mandou os holerites por WhatsApp. Pediu para retornar depois das 18h. Quer saber o valor da entrada."} />
        </Campo>

        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

/* ------------------ desfecho: ganho / perdido -------------------- */
function DesfechoModal({ tipo, cliente, ctx, onFechar }) {
  const { clientes, perfil } = ctx;
  const ganho = tipo === "ganho";
  const opcoes = ganho ? MOTIVOS_GANHO : MOTIVOS_PERDA;
  const [motivo, setMotivo] = useState("");
  const [motivoOutro, setMotivoOutro] = useState("");
  const [nota, setNota] = useState("");
  const [valor, setValor] = useState(cliente.valorProposta || "");
  const [erro, setErro] = useState("");
  const [etapa, setEtapa] = useState("form"); // form -> confirmar

  const revisar = () => {
    if (!motivo) { setErro("Escolha o motivo — é ele que alimenta o relatório."); return; }
    if (motivo === "Outro" && !motivoOutro.trim()) { setErro("Descreva o motivo no campo livre."); return; }
    setErro(""); setEtapa("confirmar");
  };

  const confirmar = () => {
    clientes.atualizar(cliente.id, {
      desfecho: tipo,
      motivo,
      motivoOutro: motivo === "Outro" ? motivoOutro.trim() : "",
      desfechoNota: nota.trim(),
      desfechoEm: new Date().toISOString(),
      desfechoPor: perfil.uid,
      estagio: ganho ? "Contrato fechado" : "Arquivado",
      valorProposta: valor ? Number(String(valor).replace(/\D/g, "")) : cliente.valorProposta || ""
    });
    onFechar();
  };

  const pendentes = (Array.isArray(cliente.followups) ? cliente.followups : []).filter(f => !f.feito).length;

  if (etapa === "confirmar") {
    return (
      <Modal titulo="Confirmar o desfecho" sub={cliente.nome} largura={560} onFechar={onFechar}
             rodape={<><Btn kind="ghost" onClick={() => setEtapa("form")}>Voltar e revisar</Btn>
                       <Btn kind={ganho ? "ok" : "danger"} onClick={confirmar}>
                         {ganho ? "Sim, marcar como ganho" : "Sim, marcar como perdido"}</Btn></>}>
        <div style={{ display:"grid", gap:14 }}>
          <div style={{ padding:"14px 16px", borderRadius:12,
                        background: ganho ? "#4F7A5C12" : "#B4472E12",
                        border:`1px solid ${ganho ? "#4F7A5C33" : "#B4472E33"}` }}>
            <div style={{ fontSize:14, fontWeight:600, marginBottom:8 }}>
              {cliente.nome} será marcado como {ganho ? "ganho" : "perdido"}.
            </div>
            <ul style={{ fontSize:13, color:C.inkSoft, lineHeight:1.8, paddingLeft:18, margin:0 }}>
              <li>Motivo: <strong>{rotulo(motivo, motivoOutro)}</strong></li>
              <li>Etapa passa para <strong>{ganho ? "Contrato fechado" : "Arquivado"}</strong></li>
              {ganho && valor ? <li>Valor fechado: <strong>{brl(valor)}</strong></li> : null}
              {pendentes > 0 && (
                <li>{pendentes} {pendentes === 1 ? "contato pendente será encerrado" : "contatos pendentes serão encerrados"} e o cliente sai da fila de follow-up</li>
              )}
            </ul>
          </div>
          <p style={{ fontSize:12.5, color:C.muted, lineHeight:1.6 }}>
            Dá para desfazer depois pela reabertura, que devolve o cliente ao funil em um novo
            ciclo e guarda este desfecho no histórico.
          </p>
        </div>
      </Modal>
    );
  }

  return (
    <Modal titulo={ganho ? "Marcar como ganho" : "Marcar como perdido"}
           sub={cliente.nome} largura={620} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind={ganho ? "ok" : "danger"} onClick={revisar}>Continuar</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <div style={{ fontSize:13, color:C.inkSoft, lineHeight:1.6, background:"#F5F6F4",
                      padding:"11px 13px", borderRadius:10 }}>
          Ao confirmar, a cadência de contato deste cliente é encerrada. Você poderá reabrir
          depois, e nesse caso o motivo registrado aqui fica guardado no histórico.
        </div>

        <SelectComOutro label={ganho ? "Motivo do ganho" : "Motivo da perda"} obrig
          opcoes={opcoes} valor={motivo} outro={motivoOutro}
          placeholder={ganho ? "Ex.: indicação do contador" : "Ex.: cliente mudou de cidade"}
          onChange={(v, o) => { setMotivo(v); setMotivoOutro(o); }} />

        {ganho && (
          <Campo label="Valor fechado" hint="Deixe como está se não houve mudança.">
            <Inp value={valor} inputMode="numeric"
                 onChange={e => setValor(e.target.value.replace(/\D/g, ""))} placeholder="R$ 0" />
          </Campo>
        )}

        <Campo label="Observação">
          <Txt value={nota} onChange={e => setNota(e.target.value)}
               placeholder="Detalhe que ajude a entender depois. Opcional." />
        </Campo>

        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

/* ------------------ exclusão de cliente (master) ----------------- */
function ExcluirClienteModal({ cliente, ctx, onFechar, onExcluido }) {
  const { clientes, processos } = ctx;
  const [texto, setTexto] = useState("");
  const [etapa, setEtapa] = useState("aviso");
  const confere = texto.trim().toUpperCase() === "EXCLUIR";

  const vinculados = processos.itens.filter(p => p.clienteId === cliente.id);
  const contatos = (Array.isArray(cliente.followups) ? cliente.followups : []).filter(f => f.feito).length;
  const ciclos = (cliente.historicoCiclos || []).length;

  const excluir = () => {
    clientes.remover(cliente.id);
    onExcluido && onExcluido();
    onFechar();
  };

  if (etapa === "final") {
    return (
      <Modal titulo="Última confirmação" sub={cliente.nome} largura={520} onFechar={onFechar}
             rodape={<><Btn kind="ghost" onClick={() => setEtapa("aviso")}>Voltar</Btn>
                       <Btn kind="danger" icon={<Icon.trash size={15} />} onClick={excluir}>
                         Excluir definitivamente</Btn></>}>
        <div style={{ padding:"16px 18px", borderRadius:12, background:"#B4472E12",
                      border:"1px solid #B4472E33" }}>
          <div className="fr" style={{ fontSize:17, fontWeight:700, marginBottom:8 }}>
            Isto não tem volta.
          </div>
          <p style={{ fontSize:13.5, color:C.inkSoft, lineHeight:1.65 }}>
            O cadastro de <strong>{cliente.nome}</strong> será apagado do banco de dados.
            Não existe lixeira nem desfazer.
          </p>
        </div>
      </Modal>
    );
  }

  return (
    <Modal titulo="Excluir cliente" sub={cliente.nome} largura={560} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="danger" disabled={!confere} onClick={() => setEtapa("final")}>
                       Continuar</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <div style={{ fontSize:13.5, color:C.inkSoft, lineHeight:1.65 }}>
          A exclusão é permanente e apaga junto tudo o que está preso a este cadastro:
        </div>
        <ul style={{ fontSize:13, color:C.inkSoft, lineHeight:1.9, paddingLeft:18, margin:0 }}>
          <li>{contatos} {contatos === 1 ? "contato registrado" : "contatos registrados"} na cadência, com as anotações</li>
          {ciclos > 0 && <li>{ciclos} {ciclos === 1 ? "ciclo anterior" : "ciclos anteriores"} no histórico</li>}
          <li>a participação dele nos relatórios de origem e conversão</li>
        </ul>

        {vinculados.length > 0 && (
          <div style={{ padding:"12px 14px", borderRadius:10, background:"#B4472E12",
                        border:"1px solid #B4472E33", fontSize:13, color:C.inkSoft, lineHeight:1.6 }}>
            Atenção: {vinculados.length} {vinculados.length === 1 ? "processo está vinculado" : "processos estão vinculados"} a
            este cliente e {vinculados.length === 1 ? "vai ficar" : "vão ficar"} sem vínculo.
            Os processos em si não são apagados.
          </div>
        )}

        <div style={{ fontSize:12.5, color:C.muted, lineHeight:1.6 }}>
          Se o cadastro está apenas errado, editar costuma ser melhor que excluir. Se o cliente
          não fechou, o caminho é marcar como perdido — assim ele continua contando no relatório.
        </div>

        <Campo label="Para confirmar, digite EXCLUIR" obrig>
          <Inp value={texto} onChange={e => setTexto(e.target.value)} placeholder="EXCLUIR" autoFocus />
        </Campo>
      </div>
    </Modal>
  );
}

/* ----------------------- reabertura ------------------------------ */
function ReabrirModal({ cliente, ctx, onFechar }) {
  const { clientes, perfil } = ctx;
  const [inicio, setInicio] = useState(todayISO());
  const [nota, setNota] = useState("");
  const [estagio, setEstagio] = useState("Novo lead");

  const reabrir = () => {
    const cicloAtual = {
      ciclo: cliente.ciclo || 1,
      inicio: cliente.inicioCiclo || (cliente.criadoEm || "").slice(0,10),
      fim: cliente.desfechoEm || new Date().toISOString(),
      desfecho: cliente.desfecho,
      motivo: cliente.motivo || "",
      motivoOutro: cliente.motivoOutro || "",
      nota: cliente.desfechoNota || "",
      followups: Array.isArray(cliente.followups) ? cliente.followups : []
    };
    clientes.atualizar(cliente.id, {
      historicoCiclos: [...(cliente.historicoCiclos || []), cicloAtual],
      ciclo: (cliente.ciclo || 1) + 1,
      inicioCiclo: inicio,
      followups: gerarFollowups(inicio),
      desfecho: null, motivo: null, motivoOutro: "", desfechoNota: "", desfechoEm: null,
      estagio,
      reabertoEm: new Date().toISOString(),
      reabertoPor: perfil.uid,
      notaReabertura: nota.trim()
    });
    onFechar();
  };

  return (
    <Modal titulo="Reabrir cliente" sub={cliente.nome} largura={620} onFechar={onFechar}
           rodape={<><Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
                     <Btn kind="brass" icon={<Icon.reopen size={15} />} onClick={reabrir}>
                       Reabrir e recomeçar cadência</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <div style={{ fontSize:13, color:C.inkSoft, lineHeight:1.6, background:"#F5F6F4",
                      padding:"11px 13px", borderRadius:10 }}>
          O ciclo atual ({cliente.ciclo || 1}º, encerrado como{" "}
          <strong>{cliente.desfecho === "ganho" ? "ganho" : "perdido"}</strong> por{" "}
          <strong>{rotulo(cliente.motivo, cliente.motivoOutro).toLowerCase()}</strong>) vai para o
          histórico e continua contando nos relatórios. O cliente volta ao funil em um novo ciclo,
          com a cadência recomeçando em D1.
        </div>

        <Campo label="Início da nova cadência" hint="D1, D3, D5, D7, D15 e D28 a partir desta data.">
          <Inp type="date" value={inicio} onChange={e => setInicio(e.target.value)} />
        </Campo>

        <Campo label="Volta para qual etapa?">
          <Sel value={estagio} onChange={e => setEstagio(e.target.value)}>
            {ESTAGIOS.filter(s => s !== "Arquivado").map(s => <option key={s} value={s}>{s}</option>)}
          </Sel>
        </Campo>

        <Campo label="O que mudou?" hint="Ajuda a entender depois por que valeu a pena reabrir.">
          <Txt value={nota} onChange={e => setNota(e.target.value)}
               placeholder="Ex.: cliente voltou a procurar depois da audiência do vizinho." />
        </Campo>
      </div>
    </Modal>
  );
}

/* ================================================================= *
 *  FOLLOW-UP — a fila de contatos do dia
 * ================================================================= */
function listarPendencias(clientes) {
  const fila = [];
  clientes.filter(c => !c.desfecho).forEach(c => {
    (Array.isArray(c.followups) ? c.followups : []).forEach((f, i) => {
      if (!f.feito) fila.push({ cliente: c, fup: f, indice: i, dias: diffDays(f.data) });
    });
  });
  return fila.sort((a, b) => a.fup.data < b.fup.data ? -1 : a.fup.data > b.fup.data ? 1 : 0);
}

/* Só o contato mais próximo de cada cliente entra na fila: cobrar D1 e D3 da
   mesma pessoa no mesmo dia é ligar duas vezes para dizer a mesma coisa. */
function filaDoDia(clientes) {
  const porCliente = {};
  listarPendencias(clientes).forEach(p => {
    if (!porCliente[p.cliente.id]) porCliente[p.cliente.id] = p;
  });
  const fila = Object.values(porCliente);
  return {
    atrasados: fila.filter(p => p.dias < 0),
    hoje:      fila.filter(p => p.dias === 0),
    semana:    fila.filter(p => p.dias > 0 && p.dias <= 7),
    depois:    fila.filter(p => p.dias > 7)
  };
}

function Followup({ ctx }) {
  const { clientes, P } = ctx;
  const [registro, setRegistro] = useState(null);
  const [detalhe, setDetalhe] = useState(null);
  const [editando, setEditando] = useState(null);
  const podeEditar = P.clientes === "tudo" || P.clientes === "editar";

  const fila = useMemo(() => filaDoDia(clientes.itens), [clientes.itens]);
  const pendente = fila.atrasados.length + fila.hoje.length;
  const emDiaNaoUtil = useMemo(() => contarNaoUteis(clientes.itens), [clientes.itens]);

  const corrigirDiasNaoUteis = () => {
    clientes.itens.filter(c => !c.desfecho).forEach(c => {
      const { lista, mudou } = ajustarParaDiasUteis(c.followups);
      if (mudou) clientes.atualizar(c.id, { followups: lista });
    });
  };

  const salvar = (cliente, i, dados) => {
    const novos = (Array.isArray(cliente.followups) ? cliente.followups : [])
      .map((f, k) => k === i ? { ...f, ...dados } : f);
    clientes.atualizar(cliente.id, { followups: novos });
  };

  const Grupo = ({ titulo, itens, cor, vazio }) => (
    <div style={{ marginBottom:26 }}>
      <div style={{ display:"flex", alignItems:"center", gap:9, marginBottom:12 }}>
        <span style={{ width:9, height:9, borderRadius:"50%", background:cor }} />
        <span className="fr" style={{ fontSize:17, fontWeight:700 }}>{titulo}</span>
        <span style={{ fontSize:13, color:C.muted }}>{itens.length}</span>
      </div>
      {itens.length === 0 ? (
        <p style={{ fontSize:13, color:C.muted, paddingLeft:18 }}>{vazio}</p>
      ) : (
        <div style={{ display:"grid", gap:9 }}>
          {itens.map(p => (
            <Card key={p.cliente.id + "-" + p.indice}
                  style={{ padding:"13px 15px", display:"flex", alignItems:"center",
                           gap:14, flexWrap:"wrap", borderLeft:`3px solid ${cor}` }}>
              <button onClick={() => setDetalhe(p.cliente.id)}
                      style={{ background:"none", border:"none", padding:0, textAlign:"left",
                               flex:1, minWidth:190 }}>
                <div style={{ fontSize:14.5, fontWeight:600 }}>{p.cliente.nome}</div>
                <div style={{ fontSize:12, color:C.muted, marginTop:3 }}>
                  {p.cliente.telefone || p.cliente.email || "sem contato cadastrado"}
                  {p.cliente.area ? ` · ${p.cliente.area}` : ""}
                  {` · ${p.cliente.estagio || "Novo lead"}`}
                </div>
              </button>

              <Tag cor={cor} forte={p.dias <= 0}>
                D{p.fup.dia} · {p.dias < 0 ? `${Math.abs(p.dias)}d atrás`
                              : p.dias === 0 ? "hoje" : fmtBR(p.fup.data)}
              </Tag>

              {podeEditar && (
                <Btn kind={p.dias <= 0 ? "brass" : "ghost"} size="sm"
                     onClick={() => setRegistro({ cliente:p.cliente, indice:p.indice, fup:p.fup })}>
                  Registrar contato
                </Btn>
              )}
            </Card>
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div className="rise">
      <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:6 }}>
        <h1 className="fr" style={{ fontSize:26, fontWeight:700, marginRight:"auto" }}>Follow-up</h1>
      </div>
      <p style={{ fontSize:13, color:C.muted, marginBottom:22, maxWidth:620, lineHeight:1.6 }}>
        {pendente === 0
          ? "Nenhum contato pendente para hoje. A cadência está em dia."
          : `${pendente} ${pendente === 1 ? "contato para fazer" : "contatos para fazer"} hoje, contando os atrasados.`}
        {" "}Cada cliente aparece uma vez só, no contato mais antigo em aberto.
      </p>

      {emDiaNaoUtil > 0 && podeEditar && (
        <Card style={{ padding:"14px 16px", marginBottom:20, background:"#9C7C3C0F",
                       borderColor:"#9C7C3C33", display:"flex", alignItems:"center",
                       gap:14, flexWrap:"wrap" }}>
          <div style={{ flex:1, minWidth:240 }}>
            <div style={{ fontSize:13.5, fontWeight:600, marginBottom:3 }}>
              {emDiaNaoUtil} {emDiaNaoUtil === 1 ? "contato caiu" : "contatos caíram"} em fim de semana ou feriado
            </div>
            <div style={{ fontSize:12.5, color:C.muted, lineHeight:1.55 }}>
              São cadências criadas antes de o sistema respeitar sábado, domingo e feriado nacional.
              O ajuste move cada um para o próximo dia útil, sem mexer no que já foi feito.
            </div>
          </div>
          <Btn kind="brass" size="sm" onClick={corrigirDiasNaoUteis}>Mover para dia útil</Btn>
        </Card>
      )}

      {clientes.carregando ? (
        <p style={{ fontSize:13, color:C.muted }}>Carregando…</p>
      ) : (
        <>
          <Grupo titulo="Atrasados" itens={fila.atrasados} cor={C.late}
                 vazio="Nada atrasado. Bom sinal." />
          <Grupo titulo="Para hoje" itens={fila.hoje} cor={C.brass}
                 vazio="Nenhum contato marcado para hoje." />
          <Grupo titulo="Próximos 7 dias" itens={fila.semana} cor={C.ok}
                 vazio="Semana sem contatos programados." />
          {fila.depois.length > 0 && (
            <p style={{ fontSize:12.5, color:C.muted }}>
              Mais {fila.depois.length} {fila.depois.length === 1 ? "contato programado" : "contatos programados"} para depois desta semana.
            </p>
          )}
        </>
      )}

      {registro && (
        <RegistroContatoModal cliente={registro.cliente} indice={registro.indice} fup={registro.fup}
                              onSalvar={dados => { salvar(registro.cliente, registro.indice, dados); setRegistro(null); }}
                              onFechar={() => setRegistro(null)} />
      )}
      {detalhe && (
        <ClienteDetalhe ctx={ctx} id={detalhe} onFechar={() => setDetalhe(null)}
                        onEditar={c => { setDetalhe(null); setEditando(c); }} />
      )}
      {editando && <ClienteForm ctx={ctx} cliente={editando} onFechar={() => setEditando(null)} />}
    </div>
  );
}

        <Vazio titulo="Nenhum processo cadastrado"

      ) : (

            const u = prox ? prazoUrgencia(prox.data, false) : null;
            return (
              <Card key={p.id} onClick={() => podeEditar && setForm(p)}
                    style={{ padding:"14px 16px", cursor: podeEditar ? "pointer" : "default",

                <div style={{ flex:1, minWidth:200 }}>
                  <div style={{ fontSize:15, fontWeight:600 }}>{p.titulo}</div>
                  <div style={{ fontSize:12, color:C.muted, marginTop:3 }}>
                    {p.numero || "sem número"} · {p.vara || "vara não informada"}
                    {cli ? ` · ${cli.nome}` : ""}
                  </div>
                </div>
                <Tag cor={C.inkSoft}>{p.status || "Ativo"}</Tag>
                {prox && <Tag cor={URG_COR[u]} forte={u === "vencido" || u === "critico"}>
                  {prox.titulo}: {URG_LABEL(prox.data, false)}</Tag>}
              </Card>
            );
          })}

        <Paginacao p={pg} rotulo="processos" />
        </>
      )}

      {form && <ProcessoForm ctx={ctx} proc={form.id ? form : null} onFechar={() => setForm(null)} />}
    </div>
  );
}

function ProcessoForm({ ctx, proc, onFechar }) {
  const { processos, clientes } = ctx;
  const ed = !!proc;
  const [f, setF] = useState(() => proc ? { ...proc, prazos: proc.prazos || [] } : {
    titulo:"", numero:"", vara:"", comarca:"", status:"Ativo", clienteId:"", parteContraria:"",
    observacoes:"", prazos:[]
  });
  const [erro, setErro] = useState("");
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const addPrazo = () => set("prazos", [...f.prazos, { titulo:"", data: todayISO(), cumprido:false }]);
  const setPrazo = (i, k, v) => set("prazos", f.prazos.map((z, j) => j === i ? { ...z, [k]: v } : z));
  const delPrazo = i => set("prazos", f.prazos.filter((_, j) => j !== i));

  const salvar = () => {
    if (!f.titulo.trim()) { setErro("Dê um título ao processo."); return; }
    const dados = { ...f, titulo:f.titulo.trim(), prazos: f.prazos.filter(z => z.titulo.trim()) };
    delete dados.id;
    if (ed) processos.atualizar(proc.id, dados);
    else processos.criar({ ...dados, criadoEm:new Date().toISOString() });
    onFechar();
  };

  return (
    <Modal titulo={ed ? "Editar processo" : "Novo processo"} largura={880} onFechar={onFechar}
           rodape={<>
             {ed && <Btn kind="danger" icon={<Icon.trash size={15} />}
                         onClick={() => { processos.remover(proc.id); onFechar(); }}
                         style={{ marginRight:"auto" }}>Excluir</Btn>}
             <Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
             <Btn kind="brass" onClick={salvar}>Salvar</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Título / assunto" obrig>
          <Inp value={f.titulo} onChange={e => set("titulo", e.target.value)}
               placeholder="Ação de cobrança — Silva x Construtora" />
        </Campo>
        <div className="grid2">
          <Campo label="Número CNJ">
            <Inp value={f.numero} onChange={e => set("numero", maskCNJ(e.target.value))}
                 placeholder="0000000-00.0000.0.00.0000" inputMode="numeric" />
          </Campo>
          <Campo label="Cliente">
            <Sel value={f.clienteId} onChange={e => set("clienteId", e.target.value)}>
              <option value="">Sem vínculo</option>
              {clientes.itens.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </Sel>
          </Campo>
        </div>
        <div className="grid2">
          <Campo label="Vara / Tribunal"><Inp value={f.vara} onChange={e => set("vara", e.target.value)} /></Campo>
          <Campo label="Comarca"><Inp value={f.comarca} onChange={e => set("comarca", e.target.value)} /></Campo>
        </div>
        <div className="grid2">
          <Campo label="Status">
            <Sel value={f.status} onChange={e => set("status", e.target.value)}>
              {STATUS_PROC.map(s => <option key={s} value={s}>{s}</option>)}
            </Sel>
          </Campo>
          <Campo label="Parte contrária">
            <Inp value={f.parteContraria} onChange={e => set("parteContraria", e.target.value)} />
          </Campo>
        </div>

        <div>
          <div style={{ display:"flex", alignItems:"center", marginBottom:8 }}>
            <span style={{ fontSize:12, fontWeight:600, color:C.inkSoft, marginRight:"auto" }}>Prazos</span>
            <Btn kind="ghost" size="sm" icon={<Icon.plus size={14} />} onClick={addPrazo}>Adicionar</Btn>
          </div>
          {f.prazos.length === 0 && (
            <p style={{ fontSize:12.5, color:C.muted }}>Nenhum prazo cadastrado neste processo.</p>
          )}
          <div style={{ display:"grid", gap:8 }}>
            {f.prazos.map((z, i) => (
              <div key={i} style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                <Inp value={z.titulo} onChange={e => setPrazo(i, "titulo", e.target.value)}
                     placeholder="Contestação" style={{ flex:"1 1 150px" }} />
                <Inp type="date" value={z.data} onChange={e => setPrazo(i, "data", e.target.value)}
                     style={{ width:150 }} />
                <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:C.muted }}>
                  <input type="checkbox" checked={!!z.cumprido}
                         onChange={e => setPrazo(i, "cumprido", e.target.checked)} /> cumprido
                </label>
                <button onClick={() => delPrazo(i)} aria-label="Remover prazo"
                        style={{ background:"none", border:"none", color:C.late, padding:6 }}>
                  <Icon.trash size={16} />
                </button>
              </div>
            ))}
          </div>
          <p style={{ fontSize:11, color:C.muted, marginTop:10, lineHeight:1.5 }}>
            O sistema alerta em 7 e em 3 dias, mas não calcula prazo processual.
            A contagem continua sendo responsabilidade do advogado.
          </p>
        </div>

        <Campo label="Observações">
          <Txt value={f.observacoes} onChange={e => set("observacoes", e.target.value)} />
        </Campo>
        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

  const [form, setForm] = useState(null);
  const hoje = todayISO();
  const [ver, setVer] = useState("proximos");

  const listaCompleta = eventos.itens
    .filter(e => ver === "proximos" ? e.data >= hoje : e.data < hoje)
    .sort((a,b) => ver === "proximos"
      ? (a.data + (a.hora||"")).localeCompare(b.data + (b.hora||""))
      : (b.data + (b.hora||"")).localeCompare(a.data + (a.hora||"")));
  const pg = usePaginacao(listaCompleta, ver);
  const lista = pg.fatia;

  return (
    <div className="rise">
      <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:18 }}>
        <h1 className="fr" style={{ fontSize:26, fontWeight:700, marginRight:"auto" }}>Agenda</h1>
        <Sel value={ver} onChange={e => setVer(e.target.value)} style={{ maxWidth:170 }}>
          <option value="proximos">Próximos</option>
          <option value="passados">Já realizados</option>
        </Sel>
        <Btn kind="brass" icon={<Icon.plus size={16} />} onClick={() => setForm({})}>Novo compromisso</Btn>
      </div>

      {listaCompleta.length === 0 ? (
        <Vazio titulo={ver === "proximos" ? "Agenda livre" : "Nada no histórico"}
               texto={ver === "proximos" ? "Cadastre audiências, consultas e reuniões para não perder nenhuma data." : "Compromissos passados aparecem aqui."}
               acao={ver === "proximos" ? <Btn kind="brass" onClick={() => setForm({})}>Cadastrar compromisso</Btn> : null} />
      ) : (
        <div style={{ display:"grid", gap:10 }}>
          {lista.map(e => {
            const cli = clientes.itens.find(c => c.id === e.clienteId);
            const d = diffDays(e.data);
            return (
              <Card key={e.id} onClick={() => setForm(e)}
                    style={{ padding:"14px 16px", cursor:"pointer", display:"flex",
                             gap:14, alignItems:"center", flexWrap:"wrap" }}>
                <div style={{ textAlign:"center", minWidth:52 }}>
                  <div className="fr" style={{ fontSize:22, fontWeight:700, lineHeight:1 }}>
                    {(e.data || "").split("-")[2]}
                  </div>
                  <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase" }}>
                    {parseISO(e.data).toLocaleDateString("pt-BR", { month:"short" }).replace(".", "")}
                  </div>
                </div>
                <div style={{ flex:1, minWidth:170 }}>
                  <div style={{ fontSize:14.5, fontWeight:600 }}>{e.titulo}</div>
                  <div style={{ fontSize:12, color:C.muted, marginTop:3 }}>
                    {e.hora || "sem horário"}{e.local ? ` · ${e.local}` : ""}{cli ? ` · ${cli.nome}` : ""}
                  </div>
                </div>
                <Tag cor={EVENTO_COR[e.tipo] || C.muted}>{e.tipo}</Tag>
                {ver === "proximos" && d <= 7 && (
                  <Tag cor={d <= 1 ? C.late : C.brass} forte={d <= 1}>
                    {d === 0 ? "hoje" : d === 1 ? "amanhã" : `em ${d}d`}
                  </Tag>
                )}
              </Card>
            );
          })}
          <Paginacao p={pg} rotulo="compromissos" />
        </div>
      )}

      {form && <EventoForm ctx={ctx} ev={form.id ? form : null} onFechar={() => setForm(null)} />}
    </div>
  );
}

function EventoForm({ ctx, ev, onFechar }) {
  const { eventos, clientes, processos } = ctx;
  const edit = !!ev;
  const [f, setF] = useState(() => ev ? { ...ev } : {
    titulo:"", tipo:"Audiência", data: todayISO(), hora:"", local:"",
    clienteId:"", processoId:"", observacoes:""
  });
  const [erro, setErro] = useState("");
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const salvar = () => {
    if (!f.titulo.trim()) { setErro("Dê um título ao compromisso."); return; }
    const dados = { ...f, titulo: f.titulo.trim() };
    delete dados.id;
    if (edit) eventos.atualizar(ev.id, dados);
    else eventos.criar({ ...dados, criadoEm:new Date().toISOString() });
    onFechar();
  };

  return (
    <Modal titulo={edit ? "Editar compromisso" : "Novo compromisso"} largura={740} onFechar={onFechar}
           rodape={<>
             {edit && <Btn kind="danger" icon={<Icon.trash size={15} />}
                           onClick={() => { eventos.remover(ev.id); onFechar(); }}
                           style={{ marginRight:"auto" }}>Excluir</Btn>}
             <Btn kind="ghost" onClick={onFechar}>Cancelar</Btn>
             <Btn kind="brass" onClick={salvar}>Salvar</Btn></>}>
      <div style={{ display:"grid", gap:14 }}>
        <Campo label="Título" obrig>
          <Inp value={f.titulo} onChange={e => set("titulo", e.target.value)}
               placeholder="Audiência de instrução" />
        </Campo>
        <div className="grid2">
          <Campo label="Tipo">
            <Sel value={f.tipo} onChange={e => set("tipo", e.target.value)}>
              {TIPO_EVENTO.map(t => <option key={t} value={t}>{t}</option>)}
            </Sel>
          </Campo>
          <Campo label="Local"><Inp value={f.local} onChange={e => set("local", e.target.value)}
                                    placeholder="Fórum, sala 3 / online" /></Campo>
        </div>
        <div className="grid2">
          <Campo label="Data"><Inp type="date" value={f.data} onChange={e => set("data", e.target.value)} /></Campo>
          <Campo label="Horário"><Inp type="time" value={f.hora} onChange={e => set("hora", e.target.value)} /></Campo>
        </div>
        <div className="grid2">
          <Campo label="Cliente">
            <Sel value={f.clienteId} onChange={e => set("clienteId", e.target.value)}>
              <option value="">Sem vínculo</option>
              {clientes.itens.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </Sel>
          </Campo>
          <Campo label="Processo">
            <Sel value={f.processoId} onChange={e => set("processoId", e.target.value)}>
              <option value="">Sem vínculo</option>
              {processos.itens.map(p => <option key={p.id} value={p.id}>{p.titulo}</option>)}
            </Sel>
          </Campo>
        </div>
        <Campo label="Observações">
          <Txt value={f.observacoes} onChange={e => set("observacoes", e.target.value)} />
        </Campo>
        {erro && <div style={{ fontSize:13, color:C.late, background:"#B4472E12",
                               padding:"9px 12px", borderRadius:9 }}>{erro}</div>}
      </div>
    </Modal>
  );
}

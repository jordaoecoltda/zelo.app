<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zelo · Demonstração — CRM Jurídico por Jordão &amp; Co</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #EDEFED; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #15243B; -webkit-font-smoothing: antialiased; }
  .fr { font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid #9C7C3C; outline-offset: -1px; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #DAD9CF; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- MODAL: correção do corte de tela ----
     O conteúdo rola dentro do próprio modal; cabeçalho e rodapé ficam fixos.
     Em telas baixas ou celular o modal ocupa a tela inteira.            */
  .mdl-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(21,36,59,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .mdl {
    background: #fff; border-radius: 16px; width: 100%;
    display: flex; flex-direction: column;
    max-height: calc(100vh - 40px);
    max-height: calc(100dvh - 40px);
    box-shadow: 0 24px 60px rgba(21,36,59,.28);
    overflow: hidden;
  }
  .mdl-head {
    flex: 0 0 auto; padding: 18px 22px;
    border-bottom: 1px solid #E6E7E2;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .mdl-body {
    flex: 1 1 auto;
    min-height: 0;            /* sem isto a área não encolhe e empurra o rodapé para fora */
    overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 20px 22px;
  }
  .mdl-foot {
    flex: 0 0 auto; padding: 14px 22px;
    border-top: 1px solid #E6E7E2; background: #fff;
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  }
  @media (max-width: 640px) {
    .mdl-bg { padding: 0; }
    .mdl {
      max-height: 100vh; height: 100vh;
      max-height: 100dvh; height: 100dvh;
      border-radius: 0;
    }
    .mdl-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
  /* telas baixas: o modal encosta nas bordas para sobrar altura de conteúdo */
  @media (max-height: 700px) {
    .mdl-bg { padding: 8px; }
    .mdl { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
    .mdl-head { padding: 12px 22px; }
    .mdl-body { padding: 14px 22px; }
    .mdl-foot { padding: 10px 22px; }
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
</style>
</head>
